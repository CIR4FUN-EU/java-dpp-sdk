services:
  dpp-repo-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DPP_REPO_POSTGRES_DB:-dpp_repo}
      POSTGRES_USER: ${DPP_REPO_POSTGRES_USER:-dpp_repo}
      POSTGRES_PASSWORD: ${DPP_REPO_POSTGRES_PASSWORD:-dpp_repo}
    ports:
      - "${DPP_REPO_POSTGRES_PORT:-5433}:5432"
    volumes:
      - dpp-repo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DPP_REPO_POSTGRES_USER:-dpp_repo} -d ${DPP_REPO_POSTGRES_DB:-dpp_repo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dpp-registry-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DPP_REGISTRY_POSTGRES_DB:-dpp_registry}
      POSTGRES_USER: ${DPP_REGISTRY_POSTGRES_USER:-dpp_registry}
      POSTGRES_PASSWORD: ${DPP_REGISTRY_POSTGRES_PASSWORD:-dpp_registry}
    ports:
      - "${DPP_REGISTRY_POSTGRES_PORT:-5434}:5432"
    volumes:
      - dpp-registry-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DPP_REGISTRY_POSTGRES_USER:-dpp_registry} -d ${DPP_REGISTRY_POSTGRES_DB:-dpp_registry}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dpp-repo-api:
    image: ${DPP_IMAGE_REGISTRY:-ghcr.io/cir4fun-eu}/${DPP_REPO_IMAGE_NAME:-dpp-repo-api}:${DPP_IMAGE_TAG:-0.6.0}
    build:
      context: .
      dockerfile: demo-dpp-repo/Dockerfile
    depends_on:
      dpp-repo-db:
        condition: service_healthy
    environment:
      DPP_REPO_PORT: ${DPP_REPO_PORT:-8080}
      DPP_REPO_BACKEND: postgres
      DPP_REPO_PROFILE: ${DPP_REPO_PROFILE:-dpp4fun}
      DPP_REPO_EVENTS_ENABLED: ${DPP_REPO_EVENTS_ENABLED:-true}
      SPRING_DATASOURCE_URL: jdbc:postgresql://dpp-repo-db:5432/${DPP_REPO_POSTGRES_DB:-dpp_repo}
      SPRING_DATASOURCE_USERNAME: ${DPP_REPO_POSTGRES_USER:-dpp_repo}
      SPRING_DATASOURCE_PASSWORD: ${DPP_REPO_POSTGRES_PASSWORD:-dpp_repo}
    ports:
      - "${DPP_REPO_PORT:-8080}:${DPP_REPO_PORT:-8080}"

  dpp-registry-api:
    image: ${DPP_IMAGE_REGISTRY:-ghcr.io/cir4fun-eu}/${DPP_REGISTRY_IMAGE_NAME:-dpp-registry-api}:${DPP_IMAGE_TAG:-0.6.0}
    build:
      context: .
      dockerfile: mock-eu-registry/Dockerfile
    depends_on:
      dpp-registry-db:
        condition: service_healthy
    environment:
      DPP_REPO_PORT: ${DPP_REPO_PORT:-8080}
      DPP_REGISTRY_PORT: ${DPP_REGISTRY_PORT:-8081}
      DPP_REGISTRY_BACKEND: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://dpp-registry-db:5432/${DPP_REGISTRY_POSTGRES_DB:-dpp_registry}
      SPRING_DATASOURCE_USERNAME: ${DPP_REGISTRY_POSTGRES_USER:-dpp_registry}
      SPRING_DATASOURCE_PASSWORD: ${DPP_REGISTRY_POSTGRES_PASSWORD:-dpp_registry}
    ports:
      - "${DPP_REGISTRY_PORT:-8081}:${DPP_REGISTRY_PORT:-8081}"

volumes:
  dpp-repo-db-data:
  dpp-registry-db-data:
